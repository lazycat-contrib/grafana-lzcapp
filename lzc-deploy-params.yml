params:
  - id: admin_password
    type: secret
    name: Admin password
    description: "Password for the built-in admin account, at least 12 characters."
    default_value: "$random(len=20)"
    optional: false
locales:
  zh:
    admin_password:
      name: 管理员密码
      description: 内置 admin 账号的密码，至少 12 位。默认随机生成，不存在内置弱口令。
